[project]
name = "finparse"
version = "0.1.0"
description = ""
authors = [{ name = "Michael Shustin", email = "michaelshustin@gmail.com" }]
requires-python = "~=3.12"
dependencies = [
    "openpyxl>=3.1.5,<4",
    "xlrd>=2.0.1,<3",
    "requests>=2.32.3,<3",
    "loguru>=0.7.2,<0.8",
    "pick>=2.3.2,<3",
    "firefly-iii-api-client>=2.0.12.0,<3",
    "pydantic-settings>=2.4.0,<3",
    "xattr>=1.1.0,<2",
    "typer>=0.12.3,<0.13",
]

[dependency-groups]
dev = [
    "black[d]>=24.8.0,<25",
    "pytest>=8.3.2,<9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
